[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "origintracer-agent"
version = "0.1.0"
description = "Evidence-grounded LangGraph investigation service for OriginTracer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "langchain>=1.0.0",
    "langchain-groq>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-mistralai>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "pre-commit>=3.7",
    "ruff>=0.4",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0",
]
evals = [
    "langgraph-sdk>=0.1.0",
    "langsmith>=0.3.0",
    "openevals>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.black]
line-length = 65
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F401", "F821"]

[tool.mypy]
ignore_missing_imports = true
files = ["src/origintracer_agent/"]
