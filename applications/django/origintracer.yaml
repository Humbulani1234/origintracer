# origintracer.yaml
# OriginTracer configuration for the Django demo application.
# Place this file in the project root (same directory as manage.py).

probes:
  - asyncio
  - django
  - langgraph

rules:
  - new_sync_call_after_deployment
  - asyncio_event_loop_starvation
  - n_plus_one_queries
  - db_query_hotspot
  - loop_runaway
  - agent_latency_hotspot

semantic:
  - label: http
    description: Full HTTP request lifecycle across all layers
    services:
      - nginx
      - uvicorn
      - gunicorn
    node_patterns:
      - ".*::request\\.entry"
      - ".*::request\\.exit"

  - label: django
    description: Django application layer
    services:
      - django
      - asyncio
    node_patterns:
      - "django::.*"
      - "asyncio::.*"

  - label: database
    description: Database queries from Django ORM
    node_patterns:
      - '(?i)django::(?:SELECT|INSERT|UPDATE|DELETE|REPLACE|WITH|PRAGMA|CREATE|ALTER|DROP|SAVEPOINT|RELEASE|COMMIT|ROLLBACK).*'

  - label: agent
    description: LangGraph model and tool calls in the Django process
    services:
      - langgraph
    node_patterns:
      - "langgraph::.*"
