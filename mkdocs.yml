site_name: OriginTracer
site_description: Probe-based Python runtime observability and causal investigations.
site_url: https://origintracer.app/docs/
repo_url: https://github.com/Humbulani1234/origintracer
repo_name: Humbulani1234/origintracer
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - stylesheets/header.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Run locally: getting-started/run-locally.md
      - Authentication: getting-started/authentication.md
  - Agentic Investigation:
      - Overview: agentic/overview.md
      - Investigation flow: agentic/investigation-flow.md
      - Agent Server API: agentic/api.md
      - Operations: agentic/operations.md
  - Probes:
      - Overview: probes/overview.md
      - Django: probes/django.md
      - asyncio: probes/asyncio/installation.md
      - asyncio architecture: probes/asyncio/architecture.md
      - LangGraph: probes/langgraph.md
  - Causal Rules:
      - Overview: rules/overview.md
      - Django: rules/django_rules.md
      - asyncio: rules/asyncio_rules.md
      - LangGraph: rules/langgraph_rules.md
  - REPL: repl/overview.md
  - React Dashboard: react_ui/overview.md
  - FastAPI Backend:
      - Overview: backend/overview.md
      - Storage: backend/storage.md
  - OpenTelemetry: otel/overview.md
  - Architecture: architecture/design.md
  - Production: deployment/production.md
  - API Reference:
      - Agent: api/agent.md
      - Agent backend: api/agent_backend.md
      - Agent graph: api/agent_graph.md
      - Agent models: api/agent_models.md
      - Agent tools: api/agent_tools.md
      - Base probe: api/base_probe.md
      - Causal rules: api/causal.md
      - Emitter: api/emitter.md
      - Engine: api/engine.md
      - Event schema: api/event_schema.md
      - Kprobe bridge: api/kprobe_bridge.md
      - OriginTracer: api/origintracer.md
      - OTel bridge: api/otel_bridge.md
      - Runtime graph: api/runtime_graph.md
      - Temporal store: api/temporal.md
      - Tracker: api/tracker.md
      - Uploader: api/uploader.md
  - Development: development/tests.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
            - agent/src
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            members_order: source
            docstring_style: numpy
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
